name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Test backend
        run: |
          cd backend
          python -m pytest || echo "No tests yet"

  build-and-test-microservice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install microservice dependencies
        run: |
          cd microservice
          pip install -r requirements.txt

      - name: Test microservice
        run: |
          cd microservice
          python -m pytest || echo "No tests yet"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  build-docker-images:
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, build-and-test-microservice, build-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build backend Docker image
        run: docker build -t studyspot-backend ./backend

      - name: Build microservice Docker image
        run: docker build -t studyspot-microservice ./microservice

      - name: Build frontend Docker image
        run: docker build -t studyspot-frontend ./frontend